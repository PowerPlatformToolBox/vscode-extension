name: Build & Lint

on:
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]

jobs:
    build:
        name: Build and Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.0.0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Production build
              run: pnpm package

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/
                  retention-days: 7
